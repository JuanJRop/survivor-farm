const chapters=[
 ['1 · Una luz en casa','Llegas a una granja abandonada. En el cofre encuentras una nota: «La tierra se apaga desde que desapareció la Semilla del Valle».','Cultiva, cocina y enciende la hoguera para pasar la primera noche.','Desbloqueo: el humo atrae a una exploradora y revela el camino al campamento. La granja será tu base de regreso.'],
 ['2 · El campamento sin suministros','La exploradora perdió su cargamento en el bosque. Te enseña que las raíces extrañas también rodean la cantera.','Recupera el cofre por el sendero seguro o cruza el claro de limos para tomar un atajo. Repara el banco y fabrica un pico.','Recompensa: acceso a la cantera y puesto de trueque. Opcional: rescata una gallina para tu granja.'],

 ['4 · El guardián herido','Sigues las raíces hasta un guardián dominado por la misma fuerza que marchita los cultivos.','Aprende a esquivar un limo, separa un grupo y derrota al guardián. Puedes preparar una hoguera antes del combate.','Recompensa: segundo fragmento. Los animales vuelven al claro y se abre el paso al santuario.'],
 ['5 · La puerta entre raíces','Los dos fragmentos revelan la verdad: el guardián protegía la puerta; la corrupción viene de dentro.','Coloca ambos fragmentos y ofrece una cosecha de tu granja. Activa el refugio y prepara comida antes de cruzar.','Desbloqueo: portal al jefe. Atajo a la granja y punto de reaparición; el portal sigue abierto si pierdes.'],
 ['6 · Recuperar la semilla','Al otro lado te espera el Rey Limo, alimentado por la semilla robada.','Esquiva sus saltos, usa las rocas como cobertura y rompe los brotes que lo curan. Ataca cuando quede agotado.','Final: recupera la semilla y vuelve por el portal. Plántala en la granja: el valle florece y quedan expediciones opcionales.']
];
